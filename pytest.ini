[pytest]
minversion = 7.0
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -m "not gpu"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    slow: marks tests as slow
    gpu: marks tests requiring GPU/PyTorch
