[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ins-vikramadithya"
version = "1.0.0"
description = "Physics-Informed TESS Exoplanet Transit Vetting Engine"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ISRO"}]
requires-python = ">=3.10"
dependencies = [
    "astropy",
    "astroquery",
    "lightkurve",
    "pandas",
    "numpy",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "pydantic",
    "matplotlib",
]

[project.optional-dependencies]
gpu = ["torch", "torchvision", "torchaudio", "transformers", "accelerate"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | env_vikram
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
