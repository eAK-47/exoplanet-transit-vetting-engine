name: GPU Tests (Optional)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/models/**'
      - '.github/workflows/gpu-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/models/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  gpu-test:
    runs-on: ubuntu-latest
    # Note: GPU runners would need to be configured separately
    # This workflow is a template for GPU-enabled testing
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install PyTorch and dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # For CPU-only testing in GitHub Actions:
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install transformers accelerate
        pip install -r requirements.txt
    
    - name: Test model inference
      run: |
        python -c "
        import torch
        from src.models.inference import SwinTransitClassifier
        
        print(f'PyTorch version: {torch.__version__}')
        print(f'CUDA available: {torch.cuda.is_available()}')
        
        # Test basic model loading (CPU)
        device = torch.device('cpu')
        try:
            model = SwinTransitClassifier(pretrained=False)
            model = model.to(device)
            model.eval()
            print('✓ Model initialized successfully')
            
            # Test inference on dummy data
            x = torch.randn(1, 3, 224, 224).to(device)
            with torch.no_grad():
                output = model(x)
            print(f'✓ Forward pass successful, output shape: {output.shape}')
        except Exception as e:
            print(f'✗ Model test failed: {e}')
            raise
        "
