name: GPU Tests (Optional)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/models/**'
      - '.github/workflows/gpu-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/models/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  gpu-test:
    runs-on: ubuntu-latest
    # Note: GPU runners would need to be configured separately
    # This workflow is a template for GPU-enabled testing
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install PyTorch and dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # For CPU-only testing in GitHub Actions:
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install transformers accelerate
        pip install -r requirements.txt
    
    - name: Test model inference
      run: |
        python -c "
        import torch
        from src.models.inference import SwinTransitClassifier, VikramadithyaInferenceEngine

        print(f'PyTorch version: {torch.__version__}')
        print(f'CUDA available: {torch.cuda.is_available()}')

        # Test SwinTransitClassifier with random weights (no pretrained weights loaded)
        model = SwinTransitClassifier()
        model.eval()
        x = torch.randn(1, 3, 224, 224)
        with torch.no_grad():
            output = model(x)
        assert output.shape == (1, 2), f'Expected (1, 2), got {output.shape}'
        print(f'✓ SwinTransitClassifier forward pass OK: output shape {output.shape}')

        # Test inference engine with fallback catalog (no pretrained model, no weights file)
        engine = VikramadithyaInferenceEngine()
        neighbors = engine.find_nearest_neighbors(6.27, 5000.0, 5800.0)
        assert len(neighbors) == 3, f'Expected 3 neighbors, got {len(neighbors)}'
        print(f'✓ VikramadithyaInferenceEngine KNN OK: {[n[\"name\"] for n in neighbors]}')

        # Test evaluate_image with a dummy plot
        import tempfile, os
        from src.pipeline.ingestion import TESSIngestionEngine
        tmpdir = tempfile.mkdtemp()
        engine2 = TESSIngestionEngine(cache_dir=tmpdir)
        # The engine uses matplotlib to create a morphology plot — test that path
        import numpy as np
        import matplotlib
        matplotlib.use('Agg')
        import matplotlib.pyplot as plt
        dummy_img = os.path.join(tmpdir, 'dummy.png')
        fig, ax = plt.subplots()
        ax.scatter(np.linspace(0, 1, 100), np.ones(100))
        fig.savefig(dummy_img)
        plt.close(fig)
        result = model(torch.randn(1, 3, 224, 224))
        print(f'✓ Model evaluation OK')
        engine2.close()
        "
