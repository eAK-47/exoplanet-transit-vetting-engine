name: Build & Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        # Install core dependencies (skip PyTorch for faster CI)
        pip install astropy astroquery lightkurve pandas numpy scikit-learn
        pip install fastapi uvicorn pydantic
    
    - name: Verify package structure
      run: |
        python -c "
        import sys
        import os
        
        # Verify package structure (skip PyTorch-dependent imports)
        sys.path.insert(0, '.')
        try:
            # Test imports that don't require PyTorch
            import src.pipeline.ingestion
            print('✓ pipeline.ingestion imports successfully')
            
            import src.api.server
            print('✓ api.server imports successfully')
            
            # src.models.inference requires PyTorch - skip in standard CI
            print('✓ Package structure verified (PyTorch tests deferred to gpu-test.yml)')
            
        except ImportError as e:
            print(f'✗ Import error: {e}')
            sys.exit(1)
        "
    
    - name: Build distribution packages
      run: python -m build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
